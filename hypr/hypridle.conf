general {
    lock_cmd = pidof hyprlock || hyprlock               # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session            # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on          # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                                                   # 2.5min
    on-timeout = brightnessctl -s set 10                                            # command to run when timeout has passed
    on-resume = brightnessctl -r && notify-send "Welcome back to your desktop!"     # command to run when activity is detected after timeout has fired.
}

listener {
    timeout = 300                                                   # 5min
    on-timeout = loginctl lock-session                              # command to run when timeout has passed
}

listener {
    timeout = 330                                                   # 5.5min
    on-timeout = hyprctl dispatch dpms off                          # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r        # screen on when activity after timeout has fired
}

listener {
    timeout = 1800                                      # 30mins
    on-timeout = systemctl suspend                      # suspend pc
}
