source = colors.conf

# BACKGROUND
background {
    # path = ~/Pictures/wallpaper/anime/darkish.jpg # lockscreen_background
    path = $image # lockscreen_background

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 2
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0

}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $primary
    font_size = 150
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 350
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $secondary
    font_size = 150
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 180
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = $tertiary
    font_size = 24
    font_family = JetBrains Nerd Font Propo 10

    position = 0, 50
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $tertiary
    font_size = 18
    font_family = JetBrains Nerd Font Propo 10

    position = 0, 15
    halign = center
    valign = center
}

# Degrees
label {
    monitor =
    text = cmd[update:18000000] echo "<b>Drifts near<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = $source_color
    font_size = 16
    font_family = JetBrains Nerd Font Propo  10

    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 40
    outer_color = $primary
    inner_color = $secondary
    font_color = $surface
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, 120
    halign = center
    valign = bottom
}
